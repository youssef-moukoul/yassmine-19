<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joyeux anniversaire Yasmine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EDFF; --ink:#2A1240; --soft:#6B4F8A; --card:#FFFFFF; --rose:#E8317A; --sun:#FFC83D; --lav:#CDB8FF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1D0C31; --ink:#F7EEFF; --soft:#BBA2DA; --card:#2D1550; --rose:#FF6FA5; --sun:#FFD25E; --lav:#5B3C93; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#1D0C31; --ink:#F7EEFF; --soft:#BBA2DA; --card:#2D1550; --rose:#FF6FA5; --sun:#FFD25E; --lav:#5B3C93; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
main{max-width:720px;margin:0 auto;padding:0 20px 80px}
section{padding:56px 0}
h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.05;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.6rem;margin:0 0 8px;font-weight:800}
p{margin:0 0 12px}
.hand{font-family:"Caveat",cursive;font-size:1.6rem;color:var(--rose)}
.big{font-size:clamp(7rem,38vw,12rem);font-weight:800;line-height:.9;color:var(--rose);margin:18px 0 0;letter-spacing:-.05em}
.candles{display:flex;flex-wrap:wrap;gap:10px 8px;margin:18px 0 24px}
.candle{width:12px;height:34px;background:var(--lav);border-radius:3px;position:relative}
.candle::before{content:"";position:absolute;left:50%;top:-14px;width:10px;height:14px;margin-left:-5px;background:var(--sun);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate;box-shadow:0 0 12px var(--sun)}
.candle:nth-child(odd)::before{animation-delay:.3s}
.out .candle::before{animation:none;opacity:0;transform:scale(.2);transition:opacity .5s,transform .5s}
@keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.12,.9) rotate(4deg)}}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:14px 26px;background:var(--rose);color:#fff;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
button.alt{background:var(--ink);color:var(--bg)}
.gift{display:block;margin:20px auto 0;width:170px;height:170px;position:relative;background:none;padding:0;border-radius:18px}
.gift .box{position:absolute;left:10px;right:10px;bottom:0;height:110px;background:var(--rose);border-radius:10px}
.gift .lid{position:absolute;left:0;right:0;top:26px;height:48px;background:var(--rose);border-radius:10px;filter:brightness(.88);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.gift .rib{position:absolute;left:50%;width:22px;margin-left:-11px;top:26px;bottom:0;background:var(--sun)}
.gift.open .lid{transform:translate(40px,-70px) rotate(24deg)}
.card{background:var(--card);border:2px solid var(--lav);border-radius:22px;padding:24px;margin-top:22px}
.card p.msg{font-size:1.2rem;margin:0}
.wish{min-height:130px;display:flex;align-items:center}
.wish p{font-family:"Caveat",cursive;font-size:2rem;line-height:1.15;margin:0;color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.count{color:var(--soft);font-size:.95rem}
.intro{margin:40px 0 0;padding:18px 22px;border-left:5px solid var(--rose);background:var(--card);border-radius:0 18px 18px 0;font-size:1.15rem}
.bouquet{width:230px;max-width:70%;margin:0 auto 16px;display:block}
.bq{text-align:center}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
footer{text-align:center;color:var(--soft)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion: reduce){.candle::before{animation:none}.pop{animation:none}.gift .lid{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect } = React;
const h = React.createElement;

/* ====== À PERSONNALISER ====== */
const NOM = "Yasmine";
const AGE = 19;
const MESSAGE_CADEAU = "Joyeux anniversaire Yasmine ! Ce site est mon cadeau pour toi. J’espère que cette nouvelle année t’apportera plein de bonheur, de réussite et de rires.";
const VOEUX = [
  "Que cette année soit remplie de rires sincères.",
  "Que tous tes projets prennent vie.",
  "Que tu gardes toujours ta belle énergie.",
  "Que chaque jour t’apporte une petite victoire.",
  "Que tu sois entourée de gens qui t’aiment.",
  "Que tu oses tout ce dont tu rêves.",
  "Que ta santé soit en or.",
  "Que tu voyages et découvres de beaux endroits.",
  "Que tes examens et tes efforts soient récompensés.",
  "Que tu restes fière de la personne que tu es.",
  "Que la chance sonne souvent à ta porte.",
  "Que tu trouves du temps pour te faire plaisir.",
  "Que tes amitiés soient fidèles et fortes.",
  "Que tu aies toujours le sourire.",
  "Que la confiance en toi grandisse chaque jour.",
  "Que les mauvais jours soient courts et les bons jours longs.",
  "Que tu réalises ce que tu entreprends.",
  "Que la vie te surprenne agréablement.",
  "Que cette 19e année soit la plus belle jusqu’ici."
];
/* ============================= */

const BOUQUET_SVG = '<svg class="bouquet" viewBox="0 0 200 210" role="img" aria-label="Bouquet de fleurs roses et blanches" xmlns="http://www.w3.org/2000/svg"><defs><g id="fl"><g fill="currentColor" stroke="#D9B8E8" stroke-width="1"><ellipse cx="0" cy="-11" rx="7" ry="11"/><ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(72)"/><ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(144)"/><ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(216)"/><ellipse cx="0" cy="-11" rx="7" ry="11" transform="rotate(288)"/></g><circle r="5" fill="#FFC83D"/></g></defs><g stroke="#3E9B5F" stroke-width="3" fill="none" stroke-linecap="round"><path d="M100 175 L100 50"/><path d="M100 175 L62 66"/><path d="M100 175 L138 66"/><path d="M100 175 L42 100"/><path d="M100 175 L158 100"/><path d="M100 175 L82 92"/><path d="M100 175 L118 92"/></g><polygon points="52,118 148,118 114,200 86,200" fill="#E8317A"/><polygon points="52,118 148,118 138,138 62,138" fill="#FF8FB8"/><use href="#fl" x="100" y="44" transform="translate(0 0)" style="color:#FF8FB8"/><use href="#fl" x="62" y="64" style="color:#FFFFFF"/><use href="#fl" x="138" y="64" style="color:#FFFFFF"/><use href="#fl" x="42" y="100" style="color:#FF8FB8"/><use href="#fl" x="158" y="100" style="color:#FF8FB8"/><use href="#fl" x="82" y="90" style="color:#FF8FB8"/><use href="#fl" x="118" y="90" style="color:#FFFFFF"/><use href="#fl" x="100" y="108" style="color:#FFFFFF"/></svg>';
const INTRO = "Ce cadeau est la seule chose que je connaisse et, comme je te l’ai déjà dit, il restera toujours avec toi. Ce n’est pas quelque chose qui disparaît avec le temps";
const PHRASE_BOUQUET = "Ce bouquet de fleurs restera toujours avec toi, dans ton téléphone";

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("fx"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#E8317A","#FFC83D","#CDB8FF","#6EE7B7","#60A5FA"];
  const ps = Array.from({length:140}, () => ({
    x: innerWidth/2, y: innerHeight*0.6,
    vx: (Math.random()-.5)*16, vy: -Math.random()*16-4,
    s: 5+Math.random()*7, r: Math.random()*6, vr: (Math.random()-.5)*.4,
    c: cols[Math.floor(Math.random()*cols.length)]
  }));
  let f = 0;
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if (++f < 130) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);
  })();
}

function Hero(){
  const [out, setOut] = useState(false);
  const blow = () => { setOut(true); confetti(); };
  return h("section", null,
    h("p", {className:"intro"}, INTRO),
    h("p", {className:"hand", style:{marginTop:32}}, "Pour toi, " + NOM),
    h("h1", null, "Joyeux anniversaire !"),
    h("div", {className:"big", "aria-label": AGE + " ans"}, String(AGE)),
    h("div", {className: "candles" + (out ? " out" : ""), "aria-hidden":"true"},
      Array.from({length:AGE}, (_, i) => h("div", {className:"candle", key:i}))),
    h("button", {onClick: blow, disabled: out, style: out ? {opacity:.6,cursor:"default"} : null},
      out ? "Bravo, les bougies sont éteintes !" : "Souffler les bougies"),
    out && h("p", {className:"hand pop", style:{marginTop:14}}, "N’oublie pas de faire un vœu…")
  );
}

function Gift(){
  const [open, setOpen] = useState(false);
  const toggle = () => { if (!open) confetti(); setOpen(!open); };
  return h("section", null,
    h("h2", null, "Ton cadeau"),
    h("p", {className:"count"}, open ? "Voici ton message." : "Touche la boîte pour l’ouvrir."),
    h("button", {className: "gift" + (open ? " open" : ""), onClick: toggle, "aria-expanded": open, "aria-label": open ? "Refermer le cadeau" : "Ouvrir le cadeau"},
      h("span", {className:"box"}), h("span", {className:"rib"}), h("span", {className:"lid"})),
    open && h("div", {className:"card pop bq"},
      h("div", {dangerouslySetInnerHTML:{__html: BOUQUET_SVG}}),
      h("p", {className:"msg"}, MESSAGE_CADEAU),
      h("p", {className:"hand", style:{marginTop:14,marginBottom:0}}, PHRASE_BOUQUET))
  );
}

function Wishes(){
  const [i, setI] = useState(-1);
  const next = () => setI(i + 1 >= VOEUX.length ? 0 : i + 1);
  return h("section", null,
    h("h2", null, VOEUX.length + " vœux pour toi"),
    h("p", null, "Un vœu à chaque clic."),
    h("div", {className:"card wish", "aria-live":"polite"},
      i < 0 ? h("p", {style:{color:"var(--soft)"}}, "Appuie sur le bouton pour découvrir le premier.")
            : h("p", {key:i, className:"pop"}, VOEUX[i])),
    h("div", {className:"row"},
      h("button", {onClick:next}, i < 0 ? "Découvrir un vœu" : "Vœu suivant"),
      i >= 0 && h("span", {className:"count"}, (i+1) + " sur " + VOEUX.length))
  );
}

function App(){
  return h("main", null,
    h(Hero), h(Gift), h(Wishes),
    h("footer", null, h("p", {className:"hand"}, "Avec toute mon affection, pour tes " + AGE + " ans."))
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
